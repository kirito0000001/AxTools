; 虚幻专用服务端日志详细度配置（WindowsServer 目标）
; 部署位置：<项目根>\Saved\Config\WindowsServer\Engine.ini
; 修改后需重启服务端生效。

[Core.Log]
; 网络相关：实测零境因单个 bunch 超过 64KB 触发 Ensure 崩溃，这一项最关键。
LogNet=Verbose
LogInit=Verbose
LogLoad=Verbose
LogWorld=Verbose
LogGameMode=Verbose
LogPlayerController=Verbose
LogOnline=Verbose
LogExit=Verbose

; LogNetTraffic 每包都会输出，日志量极大，需要时再单独临时打开：
; LogNetTraffic=Verbose
